title: "Aouda Docs"
description: "Columnar database engine for .NET with a TypeScript client SDK. Embedded or server deployment. Schema-on-write. AI-native."
remote_theme: just-the-docs/just-the-docs@v0.10.2

permalink: pretty

# Navigation
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

heading_anchors: true
color_scheme: light

# Top-level nav links (appear in header)
aux_links:
  "GitHub":
    - "https://github.com/aoudadb"

aux_links_new_tab: true

# Footer
footer_content: "Aouda &mdash; columnar database engine for .NET"

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Apply Just the Docs default layout to all pages
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

# Exclude from build
exclude:
  - _setup.ps1
  - Gemfile
  - Gemfile.lock
  - "*.gem"
  - "*.gemspec"
  - node_modules
  - examples/p40-browser-tier
  - examples/p43-write-side
